<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cooking with Nur</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #15140f; overflow: hidden; }
  body { display: flex; flex-direction: column; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
  .stage { flex: 1; display: flex; align-items: center; justify-content: center; position: relative; min-height: 0; }
  .stage img { max-width: 94%; max-height: 94%; object-fit: contain; border-radius: 6px; box-shadow: 0 10px 50px rgba(0,0,0,0.5); }
  .empty { color: #777; font-size: 14px; }
  .caption { position: absolute; top: 16px; left: 0; right: 0; text-align: center; color: #eee;
    font-size: 13px; font-weight: 600; text-shadow: 0 1px 4px rgba(0,0,0,0.6); pointer-events: none; }
  .counter { position: absolute; top: 16px; right: 20px; color: #999; font-size: 11px; pointer-events: none; }
  .arrow { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(255,255,255,0.08);
    border: none; color: #ddd; font-size: 22px; width: 44px; height: 64px; cursor: pointer; border-radius: 8px; }
  .arrow:hover { background: rgba(255,255,255,0.18); }
  .arrow.prev { left: 14px; } .arrow.next { right: 14px; }
  footer { flex-shrink: 0; padding: 14px 22px 18px; background: #1b1a14; }
  input[type=range] { width: 100%; }
  .shopping-link { display: block; text-align: center; margin-top: 8px; font-size: 12px; color: #aaa; text-decoration: none; }
  .shopping-link:hover { color: #fff; }
</style>
</head>
<body>
  <div class="stage">
    <img id="slide-img" src="slides/Barista__Fried_Onions_.png" alt="">
    <div class="caption" id="slide-caption">Barista (Fried Onions)</div>
    <div class="counter" id="slide-counter">1 / 63</div>
    
    <button class="arrow prev" id="btn-prev" aria-label="Previous">‹</button>
    <button class="arrow next" id="btn-next" aria-label="Next">›</button>
  </div>
  <footer>
    <input type="range" id="slider" min="0" max="62" value="0" >
    <a class="shopping-link" href="shopping.html">🛒 Shopping list →</a>
  </footer>
<script>
  const slides = [{"name":"Barista (Fried Onions)","src":"slides/Barista__Fried_Onions_.png"},{"name":"Mango Achar","src":"slides/Mango_Achar.png"},{"name":"Jhal Muri (Muri)","src":"slides/Jhal_Muri__Muri_.png"},{"name":"Fuchka","src":"slides/Fuchka.png"},{"name":"Mango Lassi","src":"slides/Mango_Lassi.png"},{"name":"Chai","src":"slides/Chai.png"},{"name":"Samosa","src":"slides/Samosa.png"},{"name":"Banana Bread Balls (Kolar Bora)","src":"slides/Banana_Bread_Balls__Kolar_Bora_.png"},{"name":"Shorbut","src":"slides/Shorbut.png"},{"name":"Borhani","src":"slides/Borhani.png"},{"name":"Halal Chicken Patty and Hot Dogs","src":"slides/Halal_Chicken_Patty_and_Hot_Dogs.png"},{"name":"Bengali Omelette","src":"slides/Bengali_Omelette.png"},{"name":"Mughlai Paratha","src":"slides/Mughlai_Paratha.png"},{"name":"Kitchery (Khichuri)","src":"slides/Kitchery__Khichuri_.png"},{"name":"Pulao","src":"slides/Pulao.png"},{"name":"Chicken Biryani","src":"slides/Chicken_Biryani.png"},{"name":"Goat Biryani (Plain)","src":"slides/Goat_Biryani__Plain_.png"},{"name":"Lamb Biryani (Kachi)","src":"slides/Lamb_Biryani__Kachi_.png"},{"name":"Panta Bhat","src":"slides/Panta_Bhat.png"},{"name":"Roti","src":"slides/Roti.png"},{"name":"Aloo Bhorta","src":"slides/Aloo_Bhorta.png"},{"name":"Begun Bhorta","src":"slides/Begun_Bhorta.png"},{"name":"Peyaj Bhorta","src":"slides/Peyaj_Bhorta.png"},{"name":"Chingri Maacher Bhorta","src":"slides/Chingri_Maacher_Bhorta.png"},{"name":"Fried Cauliflower","src":"slides/Fried_Cauliflower.png"},{"name":"Funny Bean w/ Shrimp","src":"slides/Funny_Bean_w__Shrimp.png"},{"name":"Long Squash (Lau)","src":"slides/Long_Squash__Lau_.png"},{"name":"Tok Daal","src":"slides/Tok_Daal.png"},{"name":"Cucumber Salad","src":"slides/Cucumber_Salad.png"},{"name":"Piaju","src":"slides/Piaju.png"},{"name":"Fried Vegetable Peels","src":"slides/Fried_Vegetable_Peels.png"},{"name":"Tamarind Achar","src":"slides/Tamarind_Achar.png"},{"name":"Moong Daal","src":"slides/Moong_Daal.png"},{"name":"Chana Daal","src":"slides/Chana_Daal.png"},{"name":"Shrimp Malai Curry","src":"slides/Shrimp_Malai_Curry.png"},{"name":"Catfish Bhuna","src":"slides/Catfish_Bhuna.png"},{"name":"Rui Macher Jhol","src":"slides/Rui_Macher_Jhol.png"},{"name":"Puti Macher Jhol","src":"slides/Puti_Macher_Jhol.png"},{"name":"Mustard Fish (Rohu/Tilapia/Carp)","src":"slides/Mustard_Fish__Rohu_Tilapia_Carp_.png"},{"name":"Quail","src":"slides/Quail.png"},{"name":"Paya (Trotter Water)","src":"slides/Paya__Trotter_Water_.png"},{"name":"Chicken Korma","src":"slides/Chicken_Korma.png"},{"name":"Beef Korma","src":"slides/Beef_Korma.png"},{"name":"Tehari","src":"slides/Tehari.png"},{"name":"Bhuna Mongsho (Beef Bhuna)","src":"slides/Bhuna_Mongsho__Beef_Bhuna_.png"},{"name":"Chicken Lal Jhol","src":"slides/Chicken_Lal_Jhol.png"},{"name":"Beef Johl","src":"slides/Beef_Johl.png"},{"name":"Shami Kabab","src":"slides/Shami_Kabab.png"},{"name":"Dim Bhuna (Egg Curry)","src":"slides/Dim_Bhuna__Egg_Curry_.png"},{"name":"Tandoori Chicken","src":"slides/Tandoori_Chicken.png"},{"name":"Biye Bari Roast","src":"slides/Biye_Bari_Roast.png"},{"name":"Roshmalai","src":"slides/Roshmalai.png"},{"name":"Mango with Rice","src":"slides/Mango_with_Rice.png"},{"name":"Rice Pudding (Payesh)","src":"slides/Rice_Pudding__Payesh_.png"},{"name":"Falooda","src":"slides/Falooda.png"},{"name":"Mishti Doi","src":"slides/Mishti_Doi.png"},{"name":"Kalo Jam","src":"slides/Kalo_Jam.png"},{"name":"Jalebi","src":"slides/Jalebi.png"},{"name":"Pathishapta Pitha","src":"slides/Pathishapta_Pitha.png"},{"name":"Bhapa Pitha","src":"slides/Bhapa_Pitha.png"},{"name":"Nokshi Pitha","src":"slides/Nokshi_Pitha.png"},{"name":"Shemai","src":"slides/Shemai.png"},{"name":"Crumchy Shemai","src":"slides/Crumchy_Shemai.png"}];
  const img = document.getElementById('slide-img');
  const caption = document.getElementById('slide-caption');
  const counter = document.getElementById('slide-counter');
  const slider = document.getElementById('slider');
  let i = 0;
  function show(n) {
    if (!slides.length) return;
    i = Math.max(0, Math.min(slides.length - 1, n));
    if (img) img.src = slides[i].src;
    caption.textContent = slides[i].name;
    counter.textContent = (i + 1) + ' / ' + slides.length;
    slider.value = i;
  }
  slider?.addEventListener('input', e => show(parseInt(e.target.value, 10)));
  document.getElementById('btn-prev')?.addEventListener('click', () => show(i - 1));
  document.getElementById('btn-next')?.addEventListener('click', () => show(i + 1));
  window.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft') show(i - 1);
    if (e.key === 'ArrowRight') show(i + 1);
  });
</script>
</body>
</html>
