<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cooking with Nur</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, sans-serif;
         background: #f5f3f0; color: #1a1a1a; }

  header { position: sticky; top: 0; z-index: 10;
           background: #fff; border-bottom: 1px solid #e8e5e1;
           padding: 12px 16px 0; }
  h1 { font-size: 1.15rem; font-weight: 800; }
  .subtitle { font-size: 11px; color: #aaa; margin-top: 1px; padding-bottom: 10px; }
  .filters { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 10px;
             -webkit-overflow-scrolling: touch; scrollbar-width: none; }
  .filters::-webkit-scrollbar { display: none; }
  .chip { flex-shrink: 0; display: inline-flex; align-items: center; gap: 4px;
          padding: 5px 11px; border-radius: 20px; border: 1.5px solid #ddd;
          background: #fff; font-size: 12px; font-weight: 600; color: #555;
          cursor: pointer; user-select: none; -webkit-tap-highlight-color: transparent;
          transition: border-color .12s, background .12s, color .12s; }
  .chip.on { border-color: #111; background: #111; color: #fff; }
  .chip-dot { width: 7px; height: 7px; border-radius: 50%; }

  main { padding-bottom: 60px; }
  .count-bar { padding: 8px 16px 4px; font-size: 11px; color: #bbb; }

  .recipe { background: #fff; margin-bottom: 2px; }
  .recipe-header { padding: 10px 14px 8px; display: flex; align-items: center; gap: 8px; }
  .recipe-name { font-size: 13px; font-weight: 700; flex: 1; }
  .prio { font-size: 9px; font-weight: 800; color: #fff;
          padding: 2px 6px; border-radius: 4px; flex-shrink: 0; }
  .cat  { font-size: 10px; color: #aaa; flex-shrink: 0; }
  .recipe img { width: 100%; display: block; }

  .empty { padding: 60px 20px; text-align: center; color: #bbb; font-size: 14px; }
</style>
</head>

<div id="app"></div>
<script type="module">
import { h, render } from 'https://esm.sh/preact@10';
import { useState, useMemo } from 'https://esm.sh/preact@10/hooks';
import htm from 'https://esm.sh/htm@3';
const html = htm.bind(h);

const RECIPES  = JSON.parse(document.getElementById('recipe-data').textContent);
const PUB_DATE = 'May 25, 2026';

const PRIO_COLOR = { P0: '#43a047', P1: '#f9a825', P2: '#f57c00' };
const ALL_CATS   = [...new Set(RECIPES.map(r => r.category).filter(Boolean))].sort();
const ALL_PRIOS  = [...new Set(RECIPES.map(r => r.priority).filter(Boolean))].sort();

function toggle(set, val) {
  const s = new Set(set);
  s.has(val) ? s.delete(val) : s.add(val);
  return s;
}

function Recipe({ r }) {
  const pc = PRIO_COLOR[r.priority];
  return html`
    <div class="recipe">
      <div class="recipe-header">
        <span class="recipe-name">${r.name}</span>
        ${pc && html`<span class="prio" style=${{ background: pc }}>${r.priority}</span>`}
        ${r.category && html`<span class="cat">${r.category}</span>`}
      </div>
      ${r.images && r.images.map(src => html`<img src=${src} loading="lazy" />`)}
    </div>
  `;
}

function App() {
  const [cats,  setCats]  = useState(new Set());
  const [prios, setPrios] = useState(new Set());

  const filtered = useMemo(() =>
    RECIPES.filter(r =>
      (cats.size  === 0 || cats.has(r.category)) &&
      (prios.size === 0 || prios.has(r.priority))
    ), [cats, prios]);

  return html`
    <header>
      <h1>🍽️ Cooking with Nur</h1>
      <p class="subtitle">Updated ${PUB_DATE} · ${RECIPES.length} recipes</p>
      <div class="filters">
        ${ALL_PRIOS.map(p => html`
          <button class=${'chip' + (prios.has(p) ? ' on' : '')}
            onClick=${() => setPrios(s => toggle(s, p))}>
            <span class="chip-dot" style=${{ background: PRIO_COLOR[p] ?? '#bbb' }} />
            ${p}
          </button>
        `)}
        ${ALL_CATS.map(c => html`
          <button class=${'chip' + (cats.has(c) ? ' on' : '')}
            onClick=${() => setCats(s => toggle(s, c))}>
            ${c}
          </button>
        `)}
      </div>
    </header>
    <main>
      <div class="count-bar">${filtered.length} of ${RECIPES.length} shown</div>
      ${filtered.length === 0
        ? html`<div class="empty">No recipes match the selected filters.</div>`
        : filtered.map(r => html`<${Recipe} key=${r.name} r=${r} />`)
      }
    </main>
  `;
}

render(html`<${App} />`, document.getElementById('app'));
</script>
</body>
</html>
