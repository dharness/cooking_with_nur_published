<title>Cooking with Nur</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
         background: #faf8f5; color: #1a1a1a; min-height: 100vh; }
  header { padding: 16px 16px 0; border-bottom: 1px solid #eee; background: #fff;
           position: sticky; top: 0; z-index: 10; }
  h1 { font-size: 1.25rem; font-weight: 800; }
  .subtitle { font-size: 11px; color: #aaa; margin-top: 2px; margin-bottom: 10px; }
  .filters { display: flex; gap: 6px; overflow-x: auto; padding: 10px 0;
             -webkit-overflow-scrolling: touch; scrollbar-width: none; }
  .filters::-webkit-scrollbar { display: none; }
  .chip { display: inline-flex; align-items: center; gap: 5px; padding: 5px 12px;
          border-radius: 20px; border: 1.5px solid #ddd; background: #fff;
          font-size: 12px; font-weight: 600; color: #555; cursor: pointer;
          white-space: nowrap; flex-shrink: 0; user-select: none;
          -webkit-tap-highlight-color: transparent; transition: border-color .1s, background .1s, color .1s; }
  .chip.on { border-color: #111; background: #111; color: #fff; }
  .chip-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  main { padding-bottom: 48px; }
  .count-bar { padding: 8px 16px 2px; font-size: 11px; color: #bbb; }
  .cat-header { padding: 14px 16px 6px; font-size: 10px; font-weight: 700;
                text-transform: uppercase; letter-spacing: .09em; color: #aaa; }
  .grid { display: grid; gap: 10px; padding: 0 16px 10px;
          grid-template-columns: repeat(2, 1fr); }
  @media (min-width: 480px)  { .grid { grid-template-columns: repeat(3, 1fr); } }
  @media (min-width: 768px)  { .grid { grid-template-columns: repeat(4, 1fr); } }
  @media (min-width: 1024px) { .grid { grid-template-columns: repeat(5, 1fr); } }
  .card { background: #fff; border-radius: 10px; overflow: hidden;
          box-shadow: 0 1px 4px rgba(0,0,0,.07); }
  .imgs { display: grid; gap: 1px; background: #eee; }
  .imgs.n1 { grid-template-columns: 1fr; }
  .imgs.n2, .imgs.n3, .imgs.n4 { grid-template-columns: repeat(2, 1fr); }
  .imgs img { width: 100%; aspect-ratio: 4/3; object-fit: cover; display: block; }
  .card-body { padding: 8px 10px 10px; }
  .card-name { font-size: 12px; font-weight: 700; line-height: 1.3; margin-bottom: 4px; }
  .card-meta { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
  .prio-badge { font-size: 9px; font-weight: 800; color: #fff;
                padding: 2px 5px; border-radius: 3px; flex-shrink: 0; }
  .cat-tag { font-size: 10px; color: #aaa; }
  .empty { padding: 60px 20px; text-align: center; color: #bbb; font-size: 14px; }
</style>

<div id="app"></div>
<script type="module">
import { h, render } from 'https://esm.sh/preact@10';
import { useState, useMemo } from 'https://esm.sh/preact@10/hooks';
import htm from 'https://esm.sh/htm@3';
const html = htm.bind(h);

const RECIPES  = JSON.parse(document.getElementById('recipe-data').textContent);
const PUB_DATE = 'May 25, 2026';

const PRIO_COLOR = { P0: '#43a047', P1: '#f9a825', P2: '#f57c00' };
const ALL_CATS   = [...new Set(RECIPES.map(r => r.category).filter(Boolean))].sort();
const ALL_PRIOS  = [...new Set(RECIPES.map(r => r.priority).filter(Boolean))].sort();

function toggle(set, val) {
  const s = new Set(set);
  s.has(val) ? s.delete(val) : s.add(val);
  return s;
}

function Card({ recipe }) {
  const shown = recipe.images.slice(0, 4);
  const nc    = Math.min(shown.length, 4);
  return html`
    <div class="card">
      <div class=${`imgs n${nc}`}>
        ${shown.map(src => html`<img src=${src} loading="lazy" />`)}
      </div>
      <div class="card-body">
        <div class="card-name">${recipe.name}</div>
        <div class="card-meta">
          ${recipe.priority && html`
            <span class="prio-badge"
              style=${'background:' + (PRIO_COLOR[recipe.priority] ?? '#bbb')}>
              ${recipe.priority}
            </span>
          `}
          ${recipe.category && html`<span class="cat-tag">${recipe.category}</span>`}
        </div>
      </div>
    </div>
  `;
}

function App() {
  const [cats,  setCats]  = useState(new Set());
  const [prios, setPrios] = useState(new Set());

  const filtered = useMemo(() =>
    RECIPES.filter(r =>
      (cats.size  === 0 || cats.has(r.category)) &&
      (prios.size === 0 || prios.has(r.priority))
    ), [cats, prios]);

  const groups = useMemo(() => {
    const g = {};
    for (const r of filtered) {
      const c = r.category || 'Other';
      if (!g[c]) g[c] = [];
      g[c].push(r);
    }
    return g;
  }, [filtered]);

  const entries = Object.entries(groups);

  return html`
    <header>
      <h1>🍽️ Cooking with Nur</h1>
      <p class="subtitle">Updated ${PUB_DATE} · ${RECIPES.length} recipes</p>
      <div class="filters">
        ${ALL_PRIOS.map(p => html`
          <button
            class=${'chip' + (prios.has(p) ? ' on' : '')}
            onClick=${() => setPrios(s => toggle(s, p))}
          >
            <span class="chip-dot" style=${'background:' + (PRIO_COLOR[p] ?? '#bbb')} />
            ${p}
          </button>
        `)}
        ${ALL_CATS.map(c => html`
          <button
            class=${'chip' + (cats.has(c) ? ' on' : '')}
            onClick=${() => setCats(s => toggle(s, c))}
          >${c}</button>
        `)}
      </div>
    </header>
    <main>
      <div class="count-bar">${filtered.length} of ${RECIPES.length} shown</div>
      ${entries.length === 0
        ? html`<div class="empty">No recipes match the selected filters.</div>`
        : entries.map(([cat, items]) => html`
            <div class="cat-header">${cat}</div>
            <div class="grid">
              ${items.map(r => html`<${Card} recipe=${r} />`)}
            </div>
          `)
      }
    </main>
  `;
}

render(html`<${App} />`, document.getElementById('app'));
</script>
